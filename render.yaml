services:
  - type: web
    name: lavender-todo
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: gunicorn todoproject.wsgi
    envVars:
      - key: DATABASE_URL
        scope: instance
      - key: SECRET_KEY
        scope: instance
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
